<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .task-card {
            transition: all 0.3s ease;
        }
        .task-card.completed {
            background-color: #f8fafc;
            opacity: 0.8;
            border-color: #cbd5e1;
        }
        .task-card.completed h4 {
            text-decoration: line-through;
            color: #64748b;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .animate-syncing {
            animation: pulse-slow 1.2s infinite ease-in-out;
        }
    </style>
</head>

    <!-- PŘIHLAŠOVACÍ OVERLAY -->

                </div>
            </div>
            
            <!-- Progress bar & Cloud stav -->

                <div class="flex justify-between w-full text-xs mb-1.5 items-center">
                    <span id="cloud-status" class="text-amber-300 font-medium animate-syncing hidden flex items-center gap-1">
                        <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>

                </div>

                </div>

                </div>
            </button>

        function doGet(e) {

            var studentId = (params.StudentId || "").toString().toLowerCase().trim();
            var action = params.action;
            var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
            var data = sheet.getDataRange().getValues();
            
            // UKLÁDÁNÍ (SAVE)
            if (action === "save") {
              var completedTasks = params.CompletedTasks || "";
              var found = false;
              
              for (var i = 1; i < data.length; i++) {
                if (data[i][0].toString().toLowerCase().trim() === studentId) {
                  sheet.getRange(i + 1, 2).setValue(completedTasks);
                  sheet.getRange(i + 1, 3).setValue(new Date());
                  found = true;
                  break;
                }
              }
              if (!found && studentId !== "") {
                sheet.appendRow([studentId, completedTasks, new Date()]);
              }
              return ContentService.createTextOutput(JSON.stringify({ status: "success" }))
                .setMimeType(ContentService.MimeType.JSON);
            }
            
            // NAČÍTÁNÍ (GET)
            var userTasks = "";
            for (var i = 1; i < data.length; i++) {
              if (data[i][0].toString().toLowerCase().trim() === studentId) {
                userTasks = data[i][1];
                break;
              }
            }
            
            var result = [{ StudentId: studentId, CompletedTasks: userTasks }];
            return ContentService.createTextOutput(JSON.stringify(result))
              .setMimeType(ContentService.MimeType.JSON);

          } catch (err) {
            return ContentService.createTextOutput(JSON.stringify({ status: "error", error: err.message }))
              .setMimeType(ContentService.MimeType.JSON);
          }
        }

        function doPost(e) {
          return doGet(e);
        }
        ===================================================================================
        */

        });

        async function initAuth() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlId = urlParams.get('student');
            const localId = localStorage.getItem('student_cloud_id');

            if (urlId) {
                currentStudentId = urlId.toLowerCase().trim();
                localStorage.setItem('student_cloud_id', currentStudentId);
            } else if (localId) {
                currentStudentId = localId.toLowerCase().trim();
            }

            if (currentStudentId) {
                hideLogin();
                updateUserHeader();
                await syncFromCloud();
            } else {
                showLoginOverlay();
            }

            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const inputId = document.getElementById('student-id-input').value.trim().toLowerCase();
                
                if (inputId) {
                    currentStudentId = inputId;
                    localStorage.setItem('student_cloud_id', inputId);
                    
                    const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?student=' + encodeURIComponent(inputId);
                    window.history.pushState({ path: newUrl }, '', newUrl);
                    
                    hideLogin();
                    updateUserHeader();
                    await syncFromCloud();
                }
            });

            document.getElementById('logout-btn').addEventListener('click', () => {
                localStorage.removeItem('student_cloud_id');
                tasksData.forEach(t => localStorage.removeItem(`task_${t.id}`));
                window.location.href = window.location.protocol + "//" + window.location.host + window.location.pathname;
            });
        }

        function showLoginOverlay() {
            document.getElementById('login-overlay').classList.remove('hidden');
        }

        function hideLogin() { 
            document.getElementById('login-overlay').classList.add('hidden'); 
        }

        function updateUserHeader() {
            document.getElementById('student-display').innerText = currentStudentId || '---';
        }

        function setCloudIndicator(show, text = "Načítám z cloudu...") {
            const statusEl = document.getElementById('cloud-status');
            const statusTextEl = document.getElementById('cloud-status-text');
            const idleEl = document.getElementById('cloud-idle');
            
            if (statusEl && idleEl) {
                if (show) {
                    if (statusTextEl) statusTextEl.innerText = text;
                    statusEl.classList.remove('hidden');
                    idleEl.classList.add('hidden');
                } else {
                    statusEl.classList.add('hidden');
                    idleEl.classList.remove('hidden');
                }
            }
        }

        async function syncFromCloud() {
            if (!currentStudentId || !GOOGLE_SCRIPT_URL) return;
            
            currentStudentId = currentStudentId.toLowerCase().trim();
            setCloudIndicator(true, "Načítám z cloudu...");

            try {
                // Přidán Timestamp pro zamezení mezipaměti
                const url = `${GOOGLE_SCRIPT_URL}?StudentId=${encodeURIComponent(currentStudentId)}&_ts=${new Date().getTime()}`;
                
                const response = await fetch(url, { 
                    method: 'GET',
                    redirect: 'follow'
                });

                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data) && data.length > 0) {
                        const completedString = data[0].CompletedTasks || "";
                        const activeIds = completedString.split(',').map(s => s.trim()).filter(Boolean);
                        
                        // Zapsat stavy z cloudu do localStorage
                        tasksData.forEach(t => {
                            const isDone = activeIds.includes(t.id.toString());
                            localStorage.setItem(`task_${t.id}`, isDone ? 'true' : 'false');
                        });
                        
                        syncUIWithStorage();
                    }
                } else {
                    console.warn("Chyba serveru při načítání:", response.status);
                    syncUIWithStorage();
                }
            } catch (error) {
                console.error("Chyba při synchronizaci z Google Sheets:", error);
                syncUIWithStorage();
            } finally {
                setCloudIndicator(false);
            }
        }

        async function saveAllToCloud() {
            if (!currentStudentId || !GOOGLE_SCRIPT_URL) return;
            
            currentStudentId = currentStudentId.toLowerCase().trim();
            setCloudIndicator(true, "Ukládám změny...");

            const completedIds = [];
            tasksData.forEach(t => {
                if (localStorage.getItem(`task_${t.id}`) === 'true') {
                    completedIds.push(t.id);
                }
            });
            const completedTasksString = completedIds.join(',');

            try {
                const url = `${GOOGLE_SCRIPT_URL}?action=save&StudentId=${encodeURIComponent(currentStudentId)}&CompletedTasks=${encodeURIComponent(completedTasksString)}&_ts=${new Date().getTime()}`;
                
                await fetch(url, { 
                    method: 'GET',
                    redirect: 'follow' 
                });
            } catch (error) {
                console.error("Chyba při ukládání do Google Sheets:", error);
            } finally {
                setTimeout(() => setCloudIndicator(false), 400);
            }
        }

        function renderChecklist() {
            const phases = ['phase1', 'phase2', 'phase3'];

            phases.forEach(phase => {
                const container = document.getElementById(`content-${phase}`);
                if (!container) return;
                container.innerHTML = '';

                const phaseTasks = tasksData.filter(t => t.phase === phase);
                const clusters = [...new Set(phaseTasks.map(t => t.cluster))];

                clusters.forEach(clusterName => {
                    const clusterGroup = document.createElement('div');
                    clusterGroup.className = `cluster-group bg-white rounded-2xl shadow-sm border-l-4 ${phaseColors[phase].border} p-5 border border-slate-200/60`;

                    const clusterHeader = document.createElement('h3');
                    clusterHeader.className = `text-base font-bold ${phaseColors[phase].text} mb-4 pb-2 border-b border-slate-100 flex items-center justify-between`;
                    clusterHeader.innerHTML = `<span>${clusterName}</span>`;
                    clusterGroup.appendChild(clusterHeader);

                    const cardsContainer = document.createElement('div');
                    cardsContainer.className = "grid grid-cols-1 gap-3.5";

                    const clusterTasks = phaseTasks.filter(t => t.cluster === clusterName);
                    clusterTasks.forEach(task => {
                        const card = document.createElement('div');
                        card.id = `card-${task.id}`;
                        card.className = "task-card border border-slate-200/80 rounded-xl p-4 bg-white flex flex-col justify-between hover:border-slate-300 transition-all";

                        let buttonHtml = '';
                        if (task.link) {
                            buttonHtml = `<a href="${task.link}" target="_blank" class="mt-3 inline-flex items-center gap-1.5 self-start text-xs font-semibold bg-blue-50 text-blue-900 px-3 py-1.5 rounded-lg border border-blue-200 hover:bg-blue-100 transition shadow-sm">🔗 Otevřít odkaz</a>`;
                        }

                        const formattedDesc = task.desc.replace(/\n/g, '<br>');

                        card.innerHTML = `
                            <div class="flex items-start gap-3.5">
                                <input type="checkbox" id="chk-${task.id}" onchange="handleTaskChange('${task.id}')" class="mt-1 w-5 h-5 accent-blue-900 cursor-pointer rounded border-slate-300 focus:ring-blue-900">
                                <div class="flex-1">
                                    <h4 class="font-bold text-slate-800 text-sm leading-snug transition-all">${task.title}</h4>
                                    <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">${formattedDesc}</p>
                                </div>
                            </div>
                            <div class="flex flex-wrap items-center justify-between gap-2 mt-3 pt-2.5 border-t border-slate-100">
                                <span class="text-[11px] font-medium bg-slate-100 text-slate-600 border border-slate-200/80 px-2.5 py-0.5 rounded-md">${task.method}</span>
                                ${buttonHtml}
                            </div>
                        `;
                        cardsContainer.appendChild(card);
                    });

                    clusterGroup.appendChild(cardsContainer);
                    container.appendChild(clusterGroup);
                });

                const successBanner = document.createElement('div');
                successBanner.id = `success-banner-${phase}`;
                successBanner.className = `success-banner ${phaseColors[phase].alertBg} border border-dashed ${phaseColors[phase].border} rounded-2xl p-6 text-center shadow-sm hidden my-6 transition-all duration-300`;
                
                let phaseReadableName = phase === 'phase1' ? 'Před odjezdem' : phase === 'phase2' ? 'Během pobytu' : 'Po návratu';
                successBanner.innerHTML = `
                    <div class="text-4xl mb-2">🎉</div>
                    <h3 class="text-base font-bold ${phaseColors[phase].text}">Skvělá práce!</h3>
                    <p class="text-xs text-slate-700 mt-1">Úspěšně jste dokončili všechny kroky pro fázi <strong>${phaseReadableName}</strong>!</p>
                `;
                container.appendChild(successBanner);
            });

            switchTab(activeTab);
        }

        function switchTab(phaseId) {
            activeTab = phaseId;
            document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
            
            const activeContent = document.getElementById(`content-${phaseId}`);
            if (activeContent) activeContent.classList.remove('hidden');

            ['phase1', 'phase2', 'phase3'].forEach(p => {
                const tab = document.getElementById(`tab-${p}`);
                if (tab) {
                    tab.className = "bg-white p-5 rounded-2xl shadow-sm border-2 border-transparent text-left transition duration-200 hover:shadow-md cursor-pointer group";
                    if (p === phaseId) {
                        tab.classList.remove('border-transparent');
                        tab.classList.add(phaseColors[p].border);
                    }
                }
            });
        }

        function handleTaskChange(taskId) {
            const checkbox = document.getElementById(`chk-${taskId}`);
            if (!checkbox) return;
            const isChecked = checkbox.checked;

            localStorage.setItem(`task_${taskId}`, isChecked ? 'true' : 'false');
            updateCardStyle(taskId, isChecked);
            recalculateProgress();
            saveAllToCloud();
        }

        function updateCardStyle(taskId, isCompleted) {
            const card = document.getElementById(`card-${taskId}`);
            const checkbox = document.getElementById(`chk-${taskId}`);
            if (!card || !checkbox) return;

            checkbox.checked = isCompleted;
            if (isCompleted) {
                card.classList.add('completed');
            } else {
                card.classList.remove('completed');
            }
        }

        function syncUIWithStorage() {
            tasksData.forEach(task => {
                const storedVal = localStorage.getItem(`task_${task.id}`);
                const isCompleted = storedVal === 'true';
                updateCardStyle(task.id, isCompleted);
            });
            recalculateProgress();
        }

        function recalculateProgress() {
            let totalTasksCount = tasksData.length;
            let totalCompletedCount = 0;
            const phases = ['phase1', 'phase2', 'phase3'];

            phases.forEach(phase => {
                const phaseTasks = tasksData.filter(t => t.phase === phase);
                const totalPhaseTasks = phaseTasks.length;
                let completedPhaseTasks = 0;

                phaseTasks.forEach(task => {
                    if (localStorage.getItem(`task_${task.id}`) === 'true') {
                        completedPhaseTasks++;
                    }
                });

                let phasePct = totalPhaseTasks > 0 ? Math.round((completedPhaseTasks / totalPhaseTasks) * 100) : 0;
                let isPhaseComplete = (phasePct === 100);
                totalCompletedCount += completedPhaseTasks;
                
                const countEl = document.getElementById(`count-${phase}`);
                if (countEl) countEl.innerText = `${completedPhaseTasks} / ${totalPhaseTasks}`;

                const progBar = document.getElementById(`progress-${phase}`);
                if (progBar) progBar.style.width = `${phasePct}%`;

                const banner = document.getElementById(`success-banner-${phase}`);
                if (banner) {
                    if (isPhaseComplete && totalPhaseTasks > 0) {
                        banner.classList.remove('hidden');
                    } else {
                        banner.classList.add('hidden');
                    }
                }
            });

            const globalPct = totalTasksCount > 0 ? Math.round((totalCompletedCount / totalTasksCount) * 100) : 0;
            const globalPctEl = document.getElementById('global-pct');
            const globalBarEl = document.getElementById('global-progress-bar');
            
            if (globalPctEl) globalPctEl.innerText = `${globalPct}%`;
            if (globalBarEl) globalBarEl.style.width = `${globalPct}%`;
        }
    </script>
</body>
