<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erasmus Task Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <nav class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i data-lucide="graduation-cap" class="w-8 h-8"></i>
                <span class="text-xl font-bold tracking-wide">Erasmus+ Task Manager</span>
            </div>
            <div class="bg-blue-700 px-4 py-1.5 rounded-full text-xs font-semibold flex items-center space-x-2">
                <i data-lucide="save" class="w-3.5 h-3.5 text-emerald-400"></i>
                <span>Automatické ukládání aktivní</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" id="app">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-8">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-sm text-slate-500 font-medium">Celkem úkolů</p>
                    <p class="text-3xl font-bold mt-1 text-slate-900" id="stat-total">13</p>
                </div>
                <div class="p-3 bg-blue-50 rounded-xl text-blue-600"><i data-lucide="list-todo"></i></div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-sm text-slate-500 font-medium">Zbývá splnit</p>
                    <p class="text-3xl font-bold mt-1 text-amber-600" id="stat-pending">13</p>
                </div>
                <div class="p-3 bg-amber-50 rounded-xl text-amber-600"><i data-lucide="clock"></i></div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-sm text-slate-500 font-medium">Hotovo</p>
                    <p class="text-3xl font-bold mt-1 text-emerald-600" id="stat-done">0</p>
                </div>
                <div class="p-3 bg-emerald-50 rounded-xl text-emerald-600"><i data-lucide="check-circle-2"></i></div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-sm text-slate-500 font-medium mb-2">Celkový progres</p>
                <div class="w-full bg-slate-100 rounded-full h-3 mt-3">
                    <div id="progress-bar" class="bg-emerald-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <p class="text-right text-xs text-slate-500 mt-1.5 font-semibold" id="progress-text">0% splněno</p>
            </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:w-96">
                <i data-lucide="search" class="w-5 h-5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="search-input" placeholder="Hledat v úkolech..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-sm transition-all">
            </div>
            <div class="flex flex-wrap gap-2 w-full md:w-auto">
                <button onclick="filterTasks('vse')" class="filter-btn active-filter px-4 py-2 text-xs font-semibold rounded-xl transition-all cursor-pointer bg-blue-600 text-white">Všechny</button>
                <button onclick="filterTasks('🛫 Před odjezdem')" class="filter-btn px-4 py-2 text-xs font-semibold rounded-xl transition-all cursor-pointer bg-slate-100 text-slate-600 hover:bg-slate-200">Před odjezdem</button>
                <button onclick="filterTasks('🎒 Během pobytu')" class="filter-btn px-4 py-2 text-xs font-semibold rounded-xl transition-all cursor-pointer bg-slate-100 text-slate-600 hover:bg-slate-200">Během pobytu</button>
                <button onclick="filterTasks('🛬 Po návratu')" class="filter-btn px-4 py-2 text-xs font-semibold rounded-xl transition-all cursor-pointer bg-slate-100 text-slate-600 hover:bg-slate-200">Po návratu</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="tasks-container">
            </div>
    </main>

    <script>
        // Data přesně zkopírovaná z tvého zdrojového souboru pro ZČU
        const defaultTasks = [
            { 
                id: 1, 
                title: "Sledování e-mailu a SPAMu", 
                phase: "🛫 Před odjezdem", 
                desc: "Způsob vyřízení: 📧 E-mail / Jiné | Pro: Všichni",
                moreInfo: "Po oficiální nominaci ze strany IO ZČU očekávejte instrukce k přihláškám. Důležité: Nekontaktujte přijímající instituci před oficiálním potvrzením nominace. Pravivelně sledujte e-mail včetně složek Spam/Nevyžádaná pošta."
            },
            { 
                id: 2, 
                title: "Nahlášení termínů a kontaktů", 
                phase: "🛫 Před odjezdem", 
                desc: "Způsob vyřízení: 📧 E-mail / Jiné | Pro: Všichni",
                moreInfo: "Nahlaste koordinátorce na ZČU přesné datum pobytu a kontaktní údaje na zahraničního fakultního koordinátora (jméno, e-mail). Termín pobytu zahrnuje výuku, zkoušky nebo jazykový kurz, ale nezahrnuje cestovní dny. Bez těchto údajů nelze podepsat OLA v systému Portál!"
            },
            { 
                id: 3, 
                title: "Sestavení a podpis OLA/LA", 
                phase: "🛫 Před odjezdem", 
                desc: "Způsob vyřízení: 🌐 Online (Portál ZČU) | Pro: Všichni",
                moreInfo: "Je nutné získat min. 20 ECTS kreditů za semestr (doporučeno 30 pro rezervu). Doktorandi místo předmětů doloží potvrzení od svého školitele na přijímající instituci. Zadání předmětů: Portál ZČU -> ECTS výjezdy -> Předměty -> Přidat další předmět. Podpis: Podepisuje se digitálně v systému EWP na Portálu (Základní údaje -> Podpis LA studentem). Pořadí podpisů: student, fakultní koordinátor ZČU, koordinátor v zahraničí. Musí být kompletně podepsáno před zahájením pobytu, jinak nebude vyplacen grant!"
            },
            { 
                id: 4, 
                title: "Založení EUR účtu a zadání do Portálu", 
                phase: "🛫 Před odjezdem", 
                desc: "Způsob vyřízení: 🌐 Online / ✍️ Fyzicky | Pro: Všichni",
                moreInfo: "Grant se vyplácí pouze na eurový účet u Komerční banky. Založení je zdarma po doložení potvrzení o studiu. Číslo účtu musíte vyplnit na Portálu v záložce Moje studium -> Moje údaje -> Bankovní EURO účet."
            },
            { 
                id: 5, 
                title: "Účastnická smlouva", 
                phase: "🛫 Před odjezdem", 
                desc: "Způsob vyřízení: ✍️ Fyzicky (Kancelář IO) | Pro: Všichni",
                moreInfo: "Podepisuje se výhradně fyzicky v kanceláři IO (místnost UU109 v hlavní budově FST), nikoliv online. O termínu podpisu (cca měsíc před výjezdem) budete informováni e-mailem."
            },
            { 
                id: 6, 
                title: "Sjednání pojištění", 
                phase: "🛫 Před odjezdem", 
                desc: "Způsob vyřízení: 📧 E-mail / Jiné | Pro: Všichni",
                moreInfo: "Evropský průkaz zdravotního pojištění (EHIC) stačí pouze pro základní krytí v rámci EU. Důrazně doporučujeme sjednat komerční cestovní pojištění, které pokryje další náklady."
            },
            { 
                id: 7, 
                title: "Žádoat o navýšení grantu (Inkluze)", 
                phase: "🛫 Před odjezdem", 
                desc: "Způsob vyřízení: 📧 E-mail / Jiné | Pro: Specifická skupina",
                moreInfo: "Studenti ze znevýhodněného socioekonomického prostředí (pobírající přídavek na dítě) mohou žádat o navýšení. K žádosti je třeba doložit „Sdělení pro účely přiznání stipendia“ od Úřadu práce ČR do konce června (ZS) / prosince (LS). Studenti se zdravotním postižením mohou zažádat o speciální grant u koordinátora Erasmus+."
            },
            { 
                id: 8, 
                title: "Ubytování a Jazyková úroveň", 
                phase: "🛫 Před odjezdem", 
                desc: "Způsob vyřízení: 📧 E-mail / Jiné | Pro: Všichni",
                moreInfo: "Zažádejte o koleje co nejdříve. Pokud univerzita koleje nemá, koordinátorka IO vám může poskytnout kontakt na studenty, kteří tam byli před vámi. Minimální doporučená úroveň jazyka je B2. Pokud škola vyžaduje certifikát, využijte OLS test od EU (kontaktujte IO) nebo požádejte vyučujícího na ZČU o potvrzení."
            },
            { 
                id: 9, 
                title: "Změna předmětů (Changes to LA)", 
                phase: "🎒 Během pobytu", 
                desc: "Způsob vyřízení: 🌐 Online (Portál ZČU) | Pro: Všichni",
                moreInfo: "Pokud po příjezdu měníte předměty, musíte změny zadat na Portál k Vašemu výjezdu. Změnový OLA (CH-LA) opět elektronicky podepisuje student, fakultní koordinátor ZČU a přijímající univerzita."
            },
            { 
                id: 10, 
                title: "Prodloužení pobytu", 
                phase: "🎒 Během pobytu", 
                desc: "Způsob vyřízení: 📧 E-mail / Jiné | Pro: Všichni (volitelně)",
                moreInfo: "Nejpozději měsíc před oficiálním koncem pobytu pošlete e-mail koordinátorce s potvrzením od ZČU i zahraniční univerzity. Po schválení se vystaví dodatek k Účastnické smlouvě a doplatí se grant."
            },
            { 
                id: 11, 
                title: "Confirmation of Erasmus+ study period", 
                phase: "🛬 Po návratu", 
                desc: "Způsob vyřízení: 📧 E-mail / Jiné | Pro: Všichni",
                moreInfo: "Potvrzení délky pobytu obdržíte od přijímající univerzity. Data musí souhlasit s Portálem a Účastnickou smlouvou. Pozor na zkrácení: Tolerance je 5 dní. Pokud zkrátíte pobyt o 6 a více dní, vracíte poměrnou část grantu!"
            },
            { 
                id: 12, 
                title: "Transcript of Records (ToR) a uznání", 
                phase: "🛬 Po návratu", 
                desc: "Způsob vyřízení: 📧 E-mail / Jiné | Pro: Všichni",
                moreInfo: "Výpis splněných předmětů a známek obdržíte od partnerské univerzity. Odevzdává se na IO i studijní oddělení spolu s Žádostí o uznání předmětů (ke stažení na webu vaší fakulty). Kredity se přepočítávají podle ECTS systému (např. 24 kreditů venku = 24 kreditů na ZČU)."
            },
            { 
                id: 13, 
                title: "Vyplnění závěrečné zprávy EU Survey", 
                phase: "🛬 Po návratu", 
                desc: "Způsob vyřízení: 🌐 Online | Pro: Všichni",
                moreInfo: "Po skončení pobytu vám přijde e-mail s odkazem na dotazník EU. Vyplnění tohoto dotazníku je povinné!"
            }
        ];

        let tasks = [];
        let currentFilter = 'vse';
        let searchQuery = '';

        function loadTasks() {
            const savedTasks = localStorage.getItem('erasmus_tasks_progress');
            if (savedTasks) {
                const parsed = JSON.parse(savedTasks);
                // Vynucená aktualizace polí moreInfo z defaultTasks, aby se předešlo problému s undefined
                tasks = defaultTasks.map(defTask => {
                    const match = parsed.find(t => t.id === defTask.id);
                    return {
                        ...defTask,
                        done: match ? match.done : false
                    };
                });
                saveTasks();
            } else {
                tasks = defaultTasks.map(task => ({ ...task, done: false }));
                saveTasks();
            }
        }

        function saveTasks() {
            localStorage.setItem('erasmus_tasks_progress', JSON.stringify(tasks));
        }

        function renderApp() {
            const container = document.getElementById('tasks-container');
            container.innerHTML = '';

            let filtered = tasks.filter(task => {
                const matchesFilter = currentFilter === 'vse' || task.phase === currentFilter;
                const matchesSearch = task.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      task.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      task.moreInfo.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesFilter && matchesSearch;
            });

            filtered.forEach(task => {
                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl p-5 border shadow-sm flex flex-col justify-between transition-all ${task.done ? 'border-emerald-100 opacity-80' : 'border-slate-100 hover:shadow-md'}`;
                
                let phaseColor = 'bg-purple-50 text-purple-600';
                if (task.phase === '🎒 Během pobytu') phaseColor = 'bg-blue-50 text-blue-600';
                if (task.phase === '🛬 Po návratu') phaseColor = 'bg-teal-50 text-teal-600';

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${phaseColor}">${task.phase.substring(2)}</span>
                        </div>
                        <h3 class="font-bold text-base mb-1 text-slate-900 ${task.done ? 'line-through text-slate-400' : ''}">${task.title}</h3>
                        <p class="text-xs text-slate-400 mb-4 font-medium">${task.desc}</p>
                        
                        <div class="mb-4">
                            <button onclick="toggleDetails(${task.id})" class="cursor-pointer text-xs font-semibold text-blue-600 hover:text-blue-800 flex items-center space-x-1 focus:outline-none">
                                <span id="btn-text-${task.id}">Zobrazit více informací</span>
                                <i data-lucide="chevron-down" id="icon-${task.id}" class="w-3.5 h-3.5 transition-transform duration-200"></i>
                            </button>
                            <div id="details-${task.id}" class="hidden mt-2 p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs text-slate-600 leading-relaxed">
                                ${task.moreInfo}
                            </div>
                        </div>
                    </div>
                    <div class="pt-4 border-t border-slate-100 flex items-center justify-end mt-auto">
                        <button onclick="toggleTask(${task.id})" class="cursor-pointer flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${task.done ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-700 hover:bg-blue-600 hover:text-white'}">
                            <i data-lucide="${task.done ? 'check' : 'circle'}" class="w-3.5 h-3.5"></i>
                            <span>${task.done ? 'Hotovo' : 'Splnit'}</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });

            // Aktualizace statistik
            const total = tasks.length;
            const done = tasks.filter(t => t.done).length;
            const pending = total - done;
            const percent = total > 0 ? Math.round((done / total) * 100) : 0;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-done').innerText = done;
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-text').innerText = `${percent}% splněno`;

            lucide.createIcons();
        }

        function toggleDetails(id) {
            const element = document.getElementById(`details-${id}`);
            const btnText = document.getElementById(`btn-text-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            
            if (element.classList.contains('hidden')) {
                element.classList.remove('hidden');
                btnText.innerText = 'Skrýt informace';
                icon.classList.add('rotate-180');
            } else {
                element.classList.add('hidden');
                btnText.innerText = 'Zobrazit více informací';
                icon.classList.remove('rotate-180');
            }
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
            saveTasks();
            renderApp();
        }

        function filterTasks(phase) {
            currentFilter = phase;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'active-filter');
                btn.classList.add('bg-slate-100', 'text-slate-600');
            });
            
            const activeBtn = event.currentTarget;
            activeBtn.classList.remove('bg-slate-100', 'text-slate-600');
            activeBtn.classList.add('bg-blue-600', 'text-white', 'active-filter');
            
            renderApp();
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderApp();
        });

        loadTasks();
        renderApp();
    </script>
</body>
</html>
