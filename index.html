<!DOCTYPE html>

        }

            background-color: #f3f4f6;

        }
        .task-card.completed h4 {
            text-decoration: line-through;
            color: #6b7280;
        }

            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

            background: #cbd5e1;
            border-radius: 4px;
        }

        }

        let activeTab = 'phase1';

        // BAREVNÁ PALETA (Fáze 1 upravena na moderní levandulovou/indigo)
        const phaseColors = {
            phase1: { border: 'border-indigo-400', text: 'text-indigo-600', bg: 'bg-indigo-400', alertBg: 'bg-indigo-50/50' },
            phase2: { border: 'border-emerald-500', text: 'text-emerald-600', bg: 'bg-emerald-500', alertBg: 'bg-emerald-50' },
            phase3: { border: 'border-purple-500', text: 'text-purple-600', bg: 'bg-purple-500', alertBg: 'bg-purple-50' }
        };

        window.addEventListener('DOMContentLoaded', () => {
            initAuth();
            renderChecklist();
            checkAndQueryStatus();
        });

        function initAuth() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlId = urlParams.get('student');
            const localId = localStorage.getItem('student_cloud_id');

            if (urlId) {
                currentStudentId = urlId;
                localStorage.setItem('student_cloud_id', urlId);
                hideLogin();
            } else if (localId) {
                currentStudentId = localId;
                hideLogin();
            } else {
                showLogin();
            }

            document.getElementById('student-display').innerText = currentStudentId || '---';

            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const inputId = document.getElementById('student-id-input').value.trim();
                if(inputId) {
                    currentStudentId = inputId;
                    localStorage.setItem('student_cloud_id', inputId);
                    const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?student=' + inputId;
                    window.history.pushState({path:newUrl}, '', newUrl);
                    document.getElementById('student-display').innerText = currentStudentId;
                    hideLogin();
                    checkAndQueryStatus();
                }
            });

            document.getElementById('logout-btn').addEventListener('click', () => {
                localStorage.removeItem('student_cloud_id');
                tasksData.forEach(t => localStorage.removeItem(`task_${t.id}`));
                window.location.href = window.location.protocol + "//" + window.location.host + window.location.pathname;
            });
        }

        function showLogin() { document.getElementById('login-overlay').classList.remove('hidden'); }
        function hideLogin() { document.getElementById('login-overlay').classList.add('hidden'); }

        function setCloudIndicator(show, text = "") {
            const statusEl = document.getElementById('cloud-status');
            const idleEl = document.getElementById('cloud-idle');
            if(show) {
                statusEl.innerText = text;
                statusEl.classList.remove('hidden');
                idleEl.classList.add('hidden');
            } else {
                statusEl.classList.add('hidden');
                idleEl.classList.remove('hidden');
            }
        }

        async function checkAndQueryStatus() {
            if (!currentStudentId) return;
            setCloudIndicator(true, "Načítám z cloudu...");

            try {
                const response = await fetch(`${SHEETDB_API_URL}/search?StudentId=${currentStudentId}`);
                if (response.ok) {
                    const data = await response.json();
                    tasksData.forEach(t => localStorage.setItem(`task_${t.id}`, 'false'));
                    if (Array.isArray(data)) {
                        data.forEach(item => {
                            if (item.Completed === 'true') {
                                localStorage.setItem(`task_${item.TaskId}`, 'true');
                            }
                        });
                    }
                }
            } catch (error) {
                console.error("Chyba cloudu:", error);
            } finally {
                setCloudIndicator(false);
                syncUIWithStorage();
            }
        }

        async function syncTaskToCloud(taskId, isCompleted) {
            if (!currentStudentId) return;
            setCloudIndicator(true, "Synchronizuji cloud...");

            try {
                if (isCompleted) {
                    await fetch(SHEETDB_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            data: [{ StudentId: currentStudentId, TaskId: taskId, Completed: 'true' }]
                        })
                    });
                } else {
                    await fetch(`${SHEETDB_API_URL}/TaskId/${taskId}?StudentId=${currentStudentId}`, {
                        method: 'DELETE'
                    });
                }
            } catch (error) {
                console.error("Chyba synchronizace:", error);
            } finally {
                setCloudIndicator(false);
            }
        }

                const phaseTasks = tasksData.filter(t => t.phase === phase);
                const clusters = [...new Set(phaseTasks.map(t => t.cluster))];

                clusters.forEach(clusterName => {
                    const clusterGroup = document.createElement('div');
                    clusterGroup.className = `cluster-group bg-white rounded-xl shadow-sm border-l-4 ${phaseColors[phase].border} p-5 mb-6`;

                    const clusterHeader = document.createElement('h3');
                    clusterHeader.className = `text-lg font-bold ${phaseColors[phase].text} mb-4 pb-2 border-b border-slate-100`;
                    clusterHeader.innerText = clusterName;
                    clusterGroup.appendChild(clusterHeader);

                    const cardsContainer = document.createElement('div');
                    cardsContainer.className = "grid grid-cols-1 gap-4";

                    const clusterTasks = phaseTasks.filter(t => t.cluster === clusterName);
                    clusterTasks.forEach(task => {
                        const card = document.createElement('div');
                        card.id = `card-${task.id}`;
                        card.className = "task-card border border-slate-200 rounded-lg p-4 bg-white flex flex-col justify-between hover:border-slate-300 transition-all";

                        let buttonHtml = '';
                        if (task.link) {
                            buttonHtml = `<a href="${task.link}" target="_blank" class="mt-3 inline-flex items-center gap-1.5 self-start text-xs font-semibold bg-blue-50 text-blue-800 px-3 py-1.5 rounded-md border border-blue-100 hover:bg-blue-100 transition">🔗 Otevřít externí odkaz</a>`;
                        }

                        const formattedDesc = task.desc.replace(/\n/g, '<br>');

                        card.innerHTML = `
                            <div class="flex items-start gap-3">
                                <input type="checkbox" id="chk-${task.id}" onchange="handleTaskChange('${task.id}')" class="mt-1.5 w-5 h-5 accent-blue-900 cursor-pointer rounded">
                                <div class="flex-1">
                                    <h4 class="font-bold text-slate-800 text-base transition-all">${task.title}</h4>
                                    <p class="text-sm text-slate-600 mt-1 leading-relaxed">${formattedDesc}</p>
                                </div>
                            </div>
                            <div class="flex flex-wrap items-center justify-between gap-2 mt-4 pt-3 border-t border-slate-50">
                                <span class="text-[11px] font-medium bg-slate-100 text-slate-600 border border-slate-200 px-2 py-0.5 rounded-md">${task.method}</span>
                                ${buttonHtml}
                            </div>
                        `;
                        cardsContainer.appendChild(card);
                    });

                    clusterGroup.appendChild(cardsContainer);
                    container.appendChild(clusterGroup);
                });

                const successBanner = document.createElement('div');
                successBanner.id = `success-banner-${phase}`;
                successBanner.className = `success-banner ${phaseColors[phase].alertBg} border border-dashed ${phaseColors[phase].border} rounded-xl p-6 text-center shadow-inner hidden my-6 transition-all duration-300`;
                
                let phaseReadableName = phase === 'phase1' ? 'Před odjezdem' : phase === 'phase2' ? 'Během pobytu' : 'Po návratu';
                successBanner.innerHTML = `
                    <div class="text-3xl mb-2">🎉</div>
                    <h3 class="text-lg font-bold ${phaseColors[phase].text}">Skvělá práce!</h3>
                    <p class="text-sm text-slate-700 mt-1">Úspěšně splněny všechny nezbytné kroky pro fázi <strong>${phaseReadableName}</strong>!</p>
                `;
                container.appendChild(successBanner);
            });

            switchTab(activeTab);
        }

        function switchTab(phaseId) {
            activeTab = phaseId;
            document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
            document.getElementById(`content-${phaseId}`).classList.remove('hidden');

            ['phase1', 'phase2', 'phase3'].forEach(p => {
                const tab = document.getElementById(`tab-${p}`);
                tab.className = "bg-white p-4 rounded-xl shadow-sm border-2 border-transparent text-left transition hover:shadow-md cursor-pointer group";
                if (p === phaseId) {
                    tab.classList.remove('border-transparent');
                    tab.classList.add(phaseColors[p].border);
                }
            });
        }

        function handleTaskChange(taskId) {
            const checkbox = document.getElementById(`chk-${taskId}`);
            const isChecked = checkbox.checked;

            localStorage.setItem(`task_${taskId}`, isChecked ? 'true' : 'false');
            updateCardStyle(taskId, isChecked);
            recalculateProgress();
            syncTaskToCloud(taskId, isChecked);
        }

        function updateCardStyle(taskId, isCompleted) {
            const card = document.getElementById(`card-${taskId}`);
            const checkbox = document.getElementById(`chk-${taskId}`);
            if(!card || !checkbox) return;

            checkbox.checked = isCompleted;
            if (isCompleted) {
                card.classList.add('completed');
            } else {
                card.classList.remove('completed');
            }
        }

        function syncUIWithStorage() {
            tasksData.forEach(task => {
                const storedVal = localStorage.getItem(`task_${task.id}`);
                const isCompleted = storedVal === 'true';
                updateCardStyle(task.id, isCompleted);
            });
            recalculateProgress();
        }

        function recalculateProgress() {
            let totalTasksCount = tasksData.length;
            let totalCompletedCount = 0;
            const phases = ['phase1', 'phase2', 'phase3'];

            phases.forEach(phase => {
                const phaseTasks = tasksData.filter(t => t.phase === phase);
                const totalPhaseTasks = phaseTasks.length;
                let completedPhaseTasks = 0;

                phaseTasks.forEach(task => {
                    if (localStorage.getItem(`task_${task.id}`) === 'true') {
                        completedPhaseTasks++;
                    }
                });

                let phasePct = 0;
                let isPhaseComplete = false;

                // LOGIKA PRO FÁZI 2 (BĚHEM POBYTU)
                if (phase === 'phase2') {
                    const t12 = localStorage.getItem('task_12') === 'true'; // Změna předmětů
                    const t13 = localStorage.getItem('task_13') === 'true'; // Prodloužení pobytu
                    const t14 = localStorage.getItem('task_14') === 'true'; // Neměním nic

                    if ((t12 && t13) || (t12 && !t14) || (t13 && !t14) || t14) {
                        phasePct = 100;
                        isPhaseComplete = true;
                        totalCompletedCount += completedPhaseTasks;
                        document.getElementById(`count-${phase}`).innerText = "Splněno (Scénář vybrán)";
                    } else {
                        phasePct = 0;
                        document.getElementById(`count-${phase}`).innerText = "Vyberte scénář pobytu";
                    }
                } else {
                    // STANDARDNÍ FÁZE
                    phasePct = totalPhaseTasks > 0 ? Math.round((completedPhaseTasks / totalPhaseTasks) * 100) : 0;
                    isPhaseComplete = (phasePct === 100);
                    totalCompletedCount += completedPhaseTasks;
                    document.getElementById(`count-${phase}`).innerText = `${completedPhaseTasks} / ${totalPhaseTasks}`;
                }

                document.getElementById(`progress-${phase}`).style.width = `${phasePct}%`;

                const banner = document.getElementById(`success-banner-${phase}`);
                if (isPhaseComplete && totalPhaseTasks > 0) {
                    banner.classList.remove('hidden');
                } else {
                    banner.classList.add('hidden');
                }
            });

            const globalPct = totalTasksCount > 0 ? Math.round((totalCompletedCount / totalTasksCount) * 100) : 0;
            document.getElementById('global-pct').innerText = `${globalPct}%`;
            document.getElementById('global-progress-bar').style.width = `${globalPct}%`;
        }
    </script>
</body>
</html>
